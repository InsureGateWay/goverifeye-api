services:
  - type: web
    name: goverifeye-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:render && npm prune --omit=dev
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health/ready
    postDeployCommand: npm run seed:platform-admin:prod
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
